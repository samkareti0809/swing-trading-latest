name: NSE Daily Swing Screener

on:
  schedule:
    # Runs Monday to Friday at 9:30 UTC (3:00 PM IST) exactly once a day
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Run Daily Screener & Database Archiver
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python daily_screener.py

      - name: Commit New Daily Setups & Archives
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f screening_history.csv ]; then git add screening_history.csv; fi
          if [ -f archived_history.csv ]; then git add archived_history.csv; fi
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update daily screening results [skip ci]" && git push)
