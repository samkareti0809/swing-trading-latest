name: NSE Daily Swing Screener

on:
  schedule:
    # Runs Monday to Friday at 9:30 UTC (3:00 PM IST)
    - cron: '30 9 * * 1-5'
  workflow_dispatch: # Allows you to run it manually anytime from GitHub UI  workflow_dispatch: # Allows you to run it manually anytime from GitHub UI

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy yfinance

      - name: Run Screener Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python daily_screener.py
